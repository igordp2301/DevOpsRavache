name: Node.js CI and Docker

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Node.js application
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run HTTP tests
        run: npm test

  docker:
    name: Build, test and publish Docker image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build --tag hello-world-api:ci .

      - name: Test running container
        run: |
          docker run --detach --name hello-world-api-ci --publish 127.0.0.1:3000:3000 hello-world-api:ci
          curl --fail --silent --show-error --retry 15 --retry-delay 1 --retry-connrefused --retry-max-time 30 http://127.0.0.1:3000/health
          test "$(curl --fail --silent --show-error http://127.0.0.1:3000/)" = "Hello World"

      - name: Show container logs on failure
        if: failure()
        run: docker logs hello-world-api-ci

      - name: Remove test container
        if: always()
        run: docker rm --force hello-world-api-ci || true

      - name: Prepare image name
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          docker tag hello-world-api:ci "$IMAGE_NAME:latest"
          docker tag hello-world-api:ci "$IMAGE_NAME:$GITHUB_SHA"
          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:$GITHUB_SHA"
